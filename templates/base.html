<!DOCTYPE html>

<html>
    <head>
        <title>Jojo's Bizarre Adventure - {% block title %} Protagonistas {% endblock %} </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='imagens/favicon.jpg') }}">
        <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    </head>

    <body>
        <header>
            <figure>
                <a href="{{ url_for('home')  }}"><img src="{{ url_for('static', filename='imagens/logo.png' )}}" alt="Logo de JoJo's" id="logo"></a>
            </figure>
        </header>

        <main>
            <nav id="navigation">
                <a href="{{ url_for('home') }}" class="nav-link" id="link1">Home</a>
                <a href="{{ url_for('personagem', nome='jonathan') }}" class="nav-link" id="link2">Jonathan</a>
                <a href="{{ url_for('personagem', nome='joseph') }}" class="nav-link" id="link3">Joseph</a>
                <a href="{{ url_for('personagem', nome='jotaro') }}" class="nav-link" id="link4">Jotaro</a>
                <a href="{{ url_for('personagem', nome='josuke') }}" class="nav-link" id="link5">Josuke</a>
                <a href="{{ url_for('personagem', nome='giorno') }}" class="nav-link" id="link6">Giorno</a>
                <a href="{{ url_for('personagem', nome='jolyne') }}" class="nav-link" id="link7">Jolyne</a>
            </nav>
            {% block content %}
            {% endblock %}
        </main>
        <footer>
            <p class="text-footer">Site desenvolvido para fins educacionais.</p>
            <p class="text-footer">Contato:</p><address>nicholas.m@escolar.ifrn.edu.br/kaio.manoel@escolar.ifrn.edu.br</address>
        </footer>
    </body>
</html>
